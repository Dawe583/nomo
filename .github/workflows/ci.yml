name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every step carries its own `timeout-minutes` and the job budget is the sum
  # of them, so a slow step is reported as itself instead of the whole job
  # dying under one shared deadline. Measured on a loaded macOS host on
  # 2026-09-26, with a cold-checkout allowance on top: `pnpm install` 1 s warm,
  # `pnpm run typecheck` 7 s, `pnpm run build` 22 s, `pnpm test` 671 s,
  # `node --test apps/control-plane/...` 1 s, `node --test scripts/src/*.test.mjs`
  # 158 s, `e2e.mjs` 1 s, `e2e-connectors.mjs` 0 s, `e2e-final.mjs` 15 s,
  # `e2e-arc.mjs` 5 s. `pnpm test` carries the `git.managed` conformance run
  # (94 s to 138 s over three runs) inside `packages/cli`, which is why it needs
  # a budget of its own rather than a share of a short job deadline.
  gates:
    strategy:
      matrix:
        node-version: [24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: pnpm run typecheck
        timeout-minutes: 10
      # Tests before the build, deliberately. The build sat first for long
      # enough that a build regression made seventeen consecutive runs report
      # failure while executing zero tests and zero end to end scripts, so the
      # red pipeline said nothing about whether the product worked. When the
      # build is what broke, the unit signal is still on the record.
      - run: pnpm test
        timeout-minutes: 25
      - run: node --test apps/control-plane/api/server.test.ts apps/control-plane/web/control-plane-pages.test.mjs apps/control-plane/web/app.test.mjs
        timeout-minutes: 5
      - run: node --test scripts/src/*.test.mjs
        working-directory: .
        timeout-minutes: 10
      - run: node scripts/src/e2e.mjs
        timeout-minutes: 5
      - run: node scripts/src/e2e-connectors.mjs
        timeout-minutes: 5
      - run: node scripts/src/e2e-final.mjs all
        timeout-minutes: 10
      - run: node scripts/src/e2e-arc.mjs all
        timeout-minutes: 5
      - run: pnpm run build
        timeout-minutes: 10

  # The hosted MCP function is Python, so until this job nothing on a remote
  # commit had ever executed its 35 tests or checked that the snapshot it
  # deploys still matches the repository it was generated from.
  #
  # The snapshot check is the reason this job exists rather than being folded
  # into the Node job. `apps/appwrite-mcp/src/appwrite_mcp/void_snapshot.json`
  # is what a deployed function serves in place of the source tree, because
  # Appwrite receives a tarball and not a checkout. A snapshot that no longer
  # matches its source is a deployed catalogue describing a product that has
  # moved on, and nothing else in CI would notice it.
  #
  # NOT VERIFIED FROM THE COMMIT THAT ADDED IT, same as the apple job: no
  # result is claimed for it here. The first failing run on a real push is the
  # baseline.
  #
  # The job budget is the sum of its steps, which is what
  # `scripts/src/ci-time-budgets.test.mjs` enforces: a job whose ceiling is below
  # its own steps would kill a run that had not finished, and report it as a
  # failure of the code under test. 5 + 5 + 10 = 20, with headroom for the SDK
  # install and the runner's own overhead.
  hosted-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the MCP SDK the hosted function depends on
        run: |
          python -m venv "$RUNNER_TEMP/void-mcp-venv"
          "$RUNNER_TEMP/void-mcp-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/void-mcp-venv/bin/python" -m pip install -r apps/appwrite-mcp/requirements.txt
      # Fails rather than regenerating. A gate that repairs what it is meant to
      # check is not a gate, and a silently rewritten snapshot would ship a
      # catalogue whose provenance nobody reviewed.
      - name: The deployed snapshot still matches the source
        run: "$RUNNER_TEMP/void-mcp-venv/bin/python apps/appwrite-mcp/scripts/generate-snapshot.py --check"
        timeout-minutes: 5
      - name: Hosted endpoint contract
        run: "$RUNNER_TEMP/void-mcp-venv/bin/python -m unittest discover -s apps/appwrite-mcp/tests -t apps/appwrite-mcp"
        timeout-minutes: 5
      # The step the contract above cannot do for itself: every test in it runs
      # from a checkout, so a reader whose fallback to the snapshot is missing
      # passes all of them and still serves an empty catalogue in production.
      # This extracts the deploy tarball somewhere with no repository in it and
      # asks the tools the same questions, so the deployed shape is the thing
      # that is checked.
      - name: The deployed tarball serves without a repository
        run: "$RUNNER_TEMP/void-mcp-venv/bin/python apps/appwrite-mcp/scripts/verify-deploy-shape.py"
        timeout-minutes: 5
      # The transport suite runs under the system interpreter because it needs
      # no SDK, and running it under the venv would prove less about the shape
      # a contributor actually has.
      - name: VOID transport suite
        run: python -m unittest discover -s python/void-transport/tests -t python/void-transport
        timeout-minutes: 10

  # The Apple surface had no runner at all until this job, which is why
  # `docs/RELEASE-1.0.1-MATRIX.md` can only cite local machine results for it.
  #
  # NOT VERIFIED FROM THE COMMIT THAT ADDED IT. This job was written on a
  # darwin host and has never been executed by GitHub Actions, so no claim is
  # made that it is green. Two things only the runner can settle, and both are
  # named in the steps below rather than guessed at: which simulator device
  # the image actually ships, and whether the host Swift toolchain builds both
  # packages. Treat the first failing run on a real push as the baseline, the
  # way the local runs recorded in the matrix are the baseline here.
  #
  # The destination is the one `docs/RELEASE-1.0.1-MATRIX.md` records for the
  # repository's own local runs. A named device is the honest form, because
  # `xcodebuild test` needs a concrete simulator and silently substituting one
  # would change what the run proves.
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Derived data outside the checkout, so a stale build product is never
      # picked up from a cached path and the working tree stays clean for the
      # next step.
      DERIVED_DATA: ${{ runner.temp }}/VOID-derived-data
    steps:
      - uses: actions/checkout@v4
      # The XcodeGen project is committed, so the job does not need the
      # generator. `pnpm apple:project:check` is skipped rather than run: it
      # compares the committed project against project.yml, which is a
      # separate concern from whether the app builds and tests.
      - name: Record the toolchain this job ran against
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project apps/apple/VOID.xcodeproj
      # The two Swift packages first, because they are host-side and fast, so a
      # broken protocol or design-system package is reported as itself rather
      # than as a simulator failure ten minutes later.
      - run: swift test --package-path apps/apple/CompanionProtocolKit
        timeout-minutes: 15
      - run: swift test --package-path apps/apple/VoidDesignSystem
        timeout-minutes: 15
      - name: Run the VOID scheme on the iOS simulator
        run: |
          xcodebuild test \
            -project apps/apple/VOID.xcodeproj \
            -scheme VOID \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
        timeout-minutes: 30
