name: Windows desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm desktop:setup
      - run: pnpm desktop:test
      - run: pnpm desktop:build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Install and smoke-test packaged application
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'VOID installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $binary = Join-Path $destination 'void-desktop.exe'
          if (!(Test-Path $binary)) { throw "Installed application missing: $binary" }
          $smoke = Start-Process -FilePath $binary -ArgumentList '--smoke-test' -PassThru
          if (!$smoke.WaitForExit(60000)) { $smoke.Kill(); throw 'Native smoke timed out' }
          if ($smoke.ExitCode -ne 0) { throw "Native smoke failed: $($smoke.ExitCode)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding utf8NoBOM (Join-Path $installer.DirectoryName 'SHA256SUMS-windows.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: VOID-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
