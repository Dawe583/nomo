name: VOID
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  CompanionProtocolKit:
    path: CompanionProtocolKit
targets:
  VOID:
    type: application
    platform: iOS
    sources:
      - path: VOIDApp
    # Xcode's Info.plist generator silently drops any INFOPLIST_KEY_* whose key
    # name contains a tilde, so `UISupportedInterfaceOrientations~ipad` cannot be
    # expressed as a build setting. It goes through a generated Info.plist file,
    # which Xcode merges on top of GENERATE_INFOPLIST_FILE output.
    info:
      path: VOIDApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: CompanionProtocolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.void.companion
        PRODUCT_NAME: VOID
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VOID
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: VOID connects only to a trusted executor you explicitly pair.
        INFOPLIST_KEY_NSFaceIDUsageDescription: VOID does not use Face ID.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  VOIDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VOIDTests
    dependencies:
      - target: VOID
      - package: CompanionProtocolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.void.companion.tests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
  VOIDUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VOIDUITests
    dependencies:
      - target: VOID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.void.companion.uitests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VOID
