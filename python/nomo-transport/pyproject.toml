[project]
name = "nomo-transport"
version = "0.1.0"
description = "Standard library Python client for the NOMO proxy HTTP transport."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
keywords = ["nomo", "mcp", "json-rpc", "transport"]
classifiers = [
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]

# No dependencies on purpose. The client speaks the wire with http.client and
# json from the standard library, so installing it must never reach a package
# index. There is no [build-system] table either: the tests import the package
# from src/ through tests/__init__.py, so nothing needs to be built and no
# backend gets downloaded to make an import work.

[tool.nomo-transport.unittest]
start-directory = "tests"
top-level-directory = "."
